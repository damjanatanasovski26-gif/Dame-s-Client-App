{% from "components.html" import ds_icon %}
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f1f33" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Damjan's Client App" />
  <title>{{ title or "Damjan's Client App" }}</title>
  <link rel="manifest" href="{{ url_for('pwa_manifest') }}?v=4">
  <link rel="icon" href="{{ url_for('static', filename='images/barbell.png') }}?v=2">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/barbell.png') }}?v=2">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ asset_v('style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}?v={{ asset_v('css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}?v={{ asset_v('css/components.css') }}">
</head>
<body class="{{ page_class or '' }}">
  <button id="themeToggle" class="ds-icon-btn ds-theme-toggle" type="button" aria-label="Toggle dark mode">
    <span class="ds-theme-icon sun" aria-hidden="true">&#9728;</span>
    <span class="ds-theme-icon moon" aria-hidden="true">&#9790;</span>
  </button>
  <button id="installAppBtn" class="ds-btn ds-btn--secondary ds-btn--sm ds-install-btn" type="button" hidden>Install App</button>
  <div id="installPromptModal" class="ds-modal-backdrop" hidden>
    <div class="ds-modal" role="dialog" aria-modal="true" aria-labelledby="installPromptTitle">
      <h3 class="ds-modal__title" id="installPromptTitle">Install Damjan's Client App?</h3>
      <p id="installPromptMessage" class="ds-field__hint">
        Add Damjan's Client App to your home screen for faster access and an app-like experience.
      </p>
      <div class="ds-modal__actions">
        <button id="installPromptConfirm" type="button" class="ds-btn ds-btn--primary">Yes, Install</button>
        <button id="installPromptLater" type="button" class="ds-btn ds-btn--secondary">Maybe Later</button>
      </div>
    </div>
  </div>
  <div id="installHelpToast" class="ds-toast" hidden></div>

  <div id="dsConfirmModal" class="ds-modal-backdrop" data-ds-modal>
    <div class="ds-modal ds-confirm-modal" role="alertdialog" aria-modal="true" aria-labelledby="dsConfirmTitle">
      <div class="ds-confirm-modal__icon">{{ ds_icon("alert-triangle", 28) }}</div>
      <h3 class="ds-modal__title" id="dsConfirmTitle">Are you sure?</h3>
      <p class="ds-field__hint" id="dsConfirmMessage"></p>
      <div class="ds-modal__actions">
        <button type="button" class="ds-btn ds-btn--secondary" id="dsConfirmCancel" data-ds-modal-close>Cancel</button>
        <button type="button" class="ds-btn ds-btn--danger" id="dsConfirmOk">Confirm</button>
      </div>
    </div>
  </div>

  <div id="dsPageRoot" class="container">
    {% block content %}{% endblock %}
  </div>
  <script>
    (function () {
      const key = "trainer_theme";
      const root = document.documentElement;
      const toggle = document.getElementById("themeToggle");
      const menuToggles = document.querySelectorAll("[data-theme-menu]");

      function getPreferredTheme() {
        const stored = localStorage.getItem(key);
        if (stored === "light" || stored === "dark") return stored;
        return "dark";
      }

      function applyTheme(theme) {
        root.classList.add("theme-transition");
        root.setAttribute("data-theme", theme);
        window.setTimeout(function () {
          root.classList.remove("theme-transition");
        }, 280);
        if (toggle) {
          toggle.setAttribute("title", theme === "dark" ? "Switch to light mode" : "Switch to dark mode");
          toggle.setAttribute("aria-label", theme === "dark" ? "Switch to light mode" : "Switch to dark mode");
        }
        menuToggles.forEach(function (button) {
          button.textContent = theme === "dark" ? "Light Mode" : "Dark Mode";
        });
      }

      const initial = getPreferredTheme();
      applyTheme(initial);

      if (toggle) {
        toggle.addEventListener("click", function () {
          const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
          localStorage.setItem(key, next);
          applyTheme(next);
        });
      }
      menuToggles.forEach(function (button) {
        button.addEventListener("click", function () {
          const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
          localStorage.setItem(key, next);
          applyTheme(next);
        });
      });
    })();

    (function () {
      // Delegated at document level (not bound per-element at page load) so
      // this keeps working for password toggles that arrive later via an
      // AJAX content swap -- e.g. logging in is a POST form, which this
      // app's shared handler intercepts and swaps in as new HTML instead of
      // a real navigation. A per-element binding pass here would only ever
      // see whatever toggles existed on the very first hard page load (the
      // login form's own), leaving every toggle on the swapped-in page (the
      // account-settings modal's, for one) with no listener at all.
      //
      // Hover and click also used to drive the same aria-pressed flag, which
      // click then read to decide which way to toggle. On a touch tap, the
      // browser fires a synthetic mouseenter/focus BEFORE the click, flipping
      // that flag to "true" first -- so click's own toggle immediately flips
      // it straight back to "false" in the same gesture. Net effect on touch:
      // tap the eye icon, nothing visibly happens. Fix: click drives its own
      // "pinned" state (kept per-toggle in a WeakMap since there's no
      // per-element closure with delegation), never touched by hover, so it
      // always toggles predictably regardless of what hover just did. Hover
      // only ever attaches on genuinely hover-capable pointers (real mice),
      // where it adds a temporary peek on top of the pinned state; touch
      // devices never get it, so nothing can mask the click toggle there.
      const supportsHover = window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches;
      const toggleState = new WeakMap();

      function stateFor(toggle) {
        let state = toggleState.get(toggle);
        if (!state) {
          state = { pinned: false, hovering: false };
          toggleState.set(toggle, state);
        }
        return state;
      }

      function resolveToggle(el) {
        const toggle = el && el.closest && el.closest("[data-password-target]");
        if (!toggle) return null;
        const targetId = toggle.getAttribute("data-password-target");
        const input = targetId && document.getElementById(targetId);
        if (!input) return null;
        return { toggle: toggle, input: input };
      }

      function render(toggle, input) {
        if (toggle.disabled || input.disabled) return;
        const state = stateFor(toggle);
        const visible = state.pinned || state.hovering;
        input.type = visible ? "text" : "password";
        toggle.setAttribute("aria-pressed", state.pinned ? "true" : "false");
        toggle.setAttribute("aria-label", visible ? "Hide password" : "Show password");
      }

      document.addEventListener("click", function (event) {
        const resolved = resolveToggle(event.target);
        if (!resolved) return;
        const state = stateFor(resolved.toggle);
        state.pinned = !state.pinned;
        render(resolved.toggle, resolved.input);
      });

      if (supportsHover) {
        // mouseover/mouseout (not mouseenter/mouseleave) because only the
        // former bubble, which delegation requires.
        document.addEventListener("mouseover", function (event) {
          const resolved = resolveToggle(event.target);
          if (!resolved) return;
          const state = stateFor(resolved.toggle);
          if (state.hovering) return;
          state.hovering = true;
          render(resolved.toggle, resolved.input);
        });
        document.addEventListener("mouseout", function (event) {
          const resolved = resolveToggle(event.target);
          if (!resolved) return;
          const state = stateFor(resolved.toggle);
          state.hovering = false;
          render(resolved.toggle, resolved.input);
        });
      }
    })();

    (function () {
      if (!("serviceWorker" in navigator)) return;
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("{{ url_for('pwa_service_worker') }}").catch(function () {
          // SW registration is optional; ignore failures.
        });
      });
    })();

    (function () {
      const btn = document.getElementById("installAppBtn");
      const menuInstallButtons = document.querySelectorAll("[data-install-menu]");
      const toast = document.getElementById("installHelpToast");
      const modal = document.getElementById("installPromptModal");
      const modalMessage = document.getElementById("installPromptMessage");
      const confirmBtn = document.getElementById("installPromptConfirm");
      const laterBtn = document.getElementById("installPromptLater");
      if (!btn || !toast || !modal || !modalMessage || !confirmBtn || !laterBtn) return;

      // beforeinstallprompt/appinstalled firing (or not) after a real install is
      // inconsistent across browsers, so once the user completes the install
      // flow we remember it so the button doesn't reappear on the next visit.
      // But this is just a cache, not a source of truth: if the app gets
      // uninstalled, the browser offering beforeinstallprompt again is real
      // proof it's no longer installed, and that always wins over the stale
      // flag (see the beforeinstallprompt handler below) — otherwise
      // uninstalling would permanently strand the button hidden.
      const installedKey = "pwa_app_installed_v1";
      function markInstalled() {
        localStorage.setItem(installedKey, "1");
        hideInstallButtons();
        closeModal();
      }
      if (localStorage.getItem(installedKey) === "1") {
        btn.hidden = true;
        menuInstallButtons.forEach(function (menuButton) { menuButton.hidden = true; });
      }

      let deferredPrompt = null;
      const ua = navigator.userAgent || "";
      const isIos = /iPad|iPhone|iPod/.test(ua);
      const isSafari = isIos && /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS/.test(ua);
      const isStandalone = window.matchMedia && window.matchMedia("(display-mode: standalone)").matches
        || window.navigator.standalone === true;
      const promptDismissKey = "pwa_install_prompt_dismissed_until_v1";
      let autoPromptShown = false;

      function showToast(message) {
        toast.textContent = message;
        toast.hidden = false;
        toast.classList.add("show");
        window.clearTimeout(showToast._t);
        showToast._t = window.setTimeout(function () {
          toast.classList.remove("show");
          window.setTimeout(function () { toast.hidden = true; }, 180);
        }, 2800);
      }

      function showButton() {
        if (isStandalone) return;
        btn.hidden = false;
        menuInstallButtons.forEach(function (menuButton) {
          menuButton.hidden = false;
        });
      }

      function hideInstallButtons() {
        btn.hidden = true;
        menuInstallButtons.forEach(function (menuButton) {
          menuButton.hidden = true;
        });
      }

      function canShowAutoPrompt() {
        if (isStandalone) return false;
        const until = Number(localStorage.getItem(promptDismissKey) || "0");
        return !until || Date.now() > until;
      }

      function dismissAutoPrompt(days) {
        const ms = (days || 7) * 24 * 60 * 60 * 1000;
        localStorage.setItem(promptDismissKey, String(Date.now() + ms));
      }

      function openModal() {
        if (isStandalone) return;
        modal.hidden = false;
        modal.classList.add("show");
      }

      menuInstallButtons.forEach(function (menuButton) {
        menuButton.addEventListener("click", function () {
          updateModalMessage();
          openModal();
        });
      });

      function closeModal() {
        modal.classList.remove("show");
        window.setTimeout(function () {
          if (!modal.classList.contains("show")) modal.hidden = true;
        }, 140);
      }

      function updateModalMessage() {
        if (deferredPrompt) {
          modalMessage.textContent = "Add Damjan's Client App to your home screen for faster access and an app-like experience.";
          confirmBtn.textContent = "Yes, Install";
          return;
        }
        if (isSafari && !isStandalone) {
          modalMessage.textContent = "On iPhone/iPad, tap Share and then Add to Home Screen to install Damjan's Client App.";
          confirmBtn.textContent = "Show Me How";
          return;
        }
        modalMessage.textContent = "Your browser may show the install option in its menu. We can try opening it now.";
        confirmBtn.textContent = "Open Install Option";
      }

      function maybeOpenAutoPrompt() {
        if (autoPromptShown || !canShowAutoPrompt()) return;
        if (!(deferredPrompt || (isSafari && !isStandalone))) return;
        autoPromptShown = true;
        updateModalMessage();
        openModal();
      }

      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        deferredPrompt = e;
        localStorage.removeItem(installedKey);
        showButton();
        maybeOpenAutoPrompt();
      });

      if (isSafari && !isStandalone) {
        showButton();
        window.setTimeout(maybeOpenAutoPrompt, 350);
      }

      async function handleInstallConfirm() {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          try {
            const choice = await deferredPrompt.userChoice;
            if (choice && choice.outcome === "accepted") {
              markInstalled();
              return;
            }
          } catch (_) {}
          deferredPrompt = null;
          dismissAutoPrompt(7);
          closeModal();
          return;
        }
        if (isSafari && !isStandalone) {
          showToast("Safari: tap Share, then Add to Home Screen.");
          dismissAutoPrompt(7);
          closeModal();
          return;
        }
        showToast("Install option may appear in your browser menu.");
        dismissAutoPrompt(7);
        closeModal();
      }

      btn.addEventListener("click", function () {
        updateModalMessage();
        openModal();
      });

      window.addEventListener("appinstalled", markInstalled);

      confirmBtn.addEventListener("click", function () {
        handleInstallConfirm();
      });

      laterBtn.addEventListener("click", function () {
        dismissAutoPrompt(7);
        closeModal();
      });

      modal.addEventListener("click", function (e) {
        if (e.target !== modal) return;
        dismissAutoPrompt(3);
        closeModal();
      });
    })();
  </script>
  <script src="{{ url_for('static', filename='js/ds-components.js') }}?v={{ asset_v('js/ds-components.js') }}" defer></script>
</body>
</html>
